<script src="config.js"></script>
<script>
let token = '', allStudents = [], contentData = { classes: [], packs: [] }, gradeContentData = {live:[],material:[],class:[],video:[]}, activeGradeType = 'live';
const $ = id => document.getElementById(id);

$('todayDate').textContent = '📅 ' + new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});

function toast(message) {
  const el = $('toast');
  el.textContent = message;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2600);
}

window.toggleAdminPassword = () => {
  const input = $('password'), button = document.querySelector('.admin-password-toggle');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  button.textContent = show ? '🙈' : '👁';
};

function setTheme() {
  document.body.classList.toggle('dark');
  localStorage.setItem('genz-admin-theme', document.body.classList.contains('dark') ? 'dark' : 'light');
  setTimeout(drawChart, 50);
}
if (localStorage.getItem('genz-admin-theme') === 'dark') document.body.classList.add('dark');
$('themeBtn').onclick = setTheme;
$('themeSide').onclick = setTheme;
$('menuBtn').onclick = () => $('sidebar').classList.toggle('open');

// --- 1. ADMIN LOGIN ---
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginButton').disabled = true;
  $('loginButton').textContent = 'Signing in...';
  $('loginError').textContent = '';
  
  try {
    const res = await window.callApi('adminLogin', $('username').value, $('password').value);
    token = res.token;
    $('loginScreen').classList.add('hidden');
    $('app').classList.remove('hidden');
    await loadDashboard();
    await loadContent();
  } catch (err) {
    $('loginError').textContent = err.message;
  } finally {
    $('loginButton').disabled = false;
    $('loginButton').textContent = 'Sign in to dashboard';
  }
});

// --- 2. DASHBOARD & STUDENTS ---
async function loadDashboard() {
  try {
    const data = await window.callApi('adminGetDashboard', token);
    allStudents = data.students || [];
    
    $('totalCount').textContent = data.total || 0;
    $('districtCount').textContent = (data.districts || []).length;
    $('recentCount').textContent = Math.min(5, data.total || 0);
    
    renderDistricts(data.districts || []);
    drawChart(data.districts || []);
    renderTable();
  } catch (err) {
    if (err.message.includes('session expired')) {
      logout(false);
      $('loginError').textContent = 'Session expired. Please sign in again.';
    } else {
      toast(err.message);
    }
  }
}

function renderDistricts(districts) {
  const list = $('districtList');
  if (!districts.length) {
    list.innerHTML = '<div class="empty">No district data yet</div>';
    return;
  }
  const max = districts[0].count || 1;
  list.innerHTML = districts.slice(0, 6).map(d => `
    <div class="district-row">
      <span>${d.name}</span>
      <div class="bar"><i style="width:${Math.max(3, d.count/max*100)}%"></i></div>
      <b>${d.count}</b>
    </div>
  `).join('');
}

function drawChart(districts) {
  const c = $('chart'), ctx = c.getContext('2d');
  const rect = c.getBoundingClientRect();
  c.width = rect.width; c.height = rect.height;
  ctx.clearRect(0, 0, rect.width, rect.height);
  
  if (!districts.length) return;
  
  const top = districts.slice(0, 7);
  const max = Math.max(1, ...top.map(x => x.count));
  const barWidth = rect.width / (top.length * 1.5);
  
  top.forEach((d, i) => {
    const x = 20 + i * (barWidth * 1.5);
    const h = (d.count / max) * (rect.height - 40);
    const y = rect.height - 30 - h;
    
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--blue').trim() || '#2864f0';
    ctx.beginPath();
    ctx.roundRect(x, y, barWidth, h, 6);
    ctx.fill();
    
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--muted').trim() || '#8490a7';
    ctx.font = '10px DM Sans';
    ctx.textAlign = 'center';
    ctx.fillText(d.name.substring(0, 5), x + barWidth/2, rect.height - 10);
  });
}

function renderTable() {
  const q = $('searchInput').value.trim().toLowerCase();
  const filtered = allStudents.filter(s => [s.firstName, s.lastName, s.email, s.whatsapp].join(' ').toLowerCase().includes(q));
  
  $('studentRows').innerHTML = filtered.length ? filtered.map(s => {
    const pay = s.paymentStatus || 'Pending';
    const access = s.accessStatus || 'Active';
    const payAction = pay === 'Approved' ? 'Set Pending' : 'Approve Payment';
    const payValue = pay === 'Approved' ? 'Pending' : 'Approved';
    
    return `<tr>
      <td><div class="student-cell"><span class="student-avatar">${s.firstName.charAt(0).toUpperCase()}</span><span>${s.firstName} ${s.lastName}<span class="sub">${s.email}</span></span></div></td>
      <td>${s.whatsapp}</td>
      <td>${s.grade}</td>
      <td>${s.district}</td>
      <td>${s.timestamp}</td>
      <td><span class="pill" style="${pay==='Approved'?'':'background:#fff4df;color:#a66a00'}">${pay}</span></td>
      <td><span class="pill" style="${access==='Active'?'':'background:#fff0f1;color:#c43e50'}">${access}</span></td>
      <td><div class="actions">
        <button class="secondary" onclick="setStudentStatus(${s.id},'payment','${payValue}')">${payAction}</button>
        <button class="tiny del" title="Delete" onclick="deleteStudent(${s.id})">×</button>
      </div></td>
    </tr>`;
  }).join('') : '<tr><td colspan="8" class="empty">No students found.</td></tr>';
}

window.setStudentStatus = async (id, type, value) => {
  try {
    await window.callApi('adminSetStudentStatus', token, id, type, value);
    toast('Student status updated.');
    await loadDashboard();
  } catch (e) {
    toast(e.message);
  }
};

window.deleteStudent = async (id) => {
  if (!confirm('Are you sure you want to delete this student?')) return;
  try {
    await window.callApi('adminDeleteStudent', token, id);
    toast('Student deleted.');
    await loadDashboard();
  } catch (e) {
    toast(e.message);
  }
};

// --- 3. NAVIGATION ---
document.querySelectorAll('.nav-btn[data-view]').forEach(b => b.onclick = () => {
  const view = b.dataset.view;
  $('dashboardView').classList.toggle('hidden', view !== 'dashboard');
  $('studentsView').classList.toggle('hidden', view !== 'students');
  $('contentView').classList.toggle('hidden', view !== 'content');
  $('gradeContentView').classList.toggle('hidden', view !== 'gradeContent');
  $('studentsTablePanel').classList.toggle('hidden', view === 'content' || view === 'gradeContent');
  
  $('crumbText').textContent = view === 'dashboard' ? 'Dashboard' : view === 'students' ? 'Students' : view === 'gradeContent' ? 'Grade Content' : 'Website Content';
  $('tableTitle').textContent = view === 'dashboard' ? 'Recent Students' : 'All Students';
  
  document.querySelectorAll('.nav-btn[data-view]').forEach(x => x.classList.toggle('active', x === b));
  $('sidebar').classList.remove('open');
  
  if (view === 'content') loadContent();
  if (view === 'gradeContent') loadGradeContent();
});

$('searchInput').addEventListener('input', renderTable);
$('clearSearch').onclick = () => { $('searchInput').value = ''; renderTable(); };
$('refreshBtn').onclick = () => { loadDashboard(); loadContent(); };

async function logout(callApi = true) {
  if (callApi && token) {
    try { await window.callApi('adminLogout', token); } catch (e) {}
  }
  token = '';
  allStudents = [];
  $('app').classList.add('hidden');
  $('loginScreen').classList.remove('hidden');
  $('password').value = '';
}
$('logoutBtn').onclick = () => logout();

// --- 4. WEBSITE CONTENT MANAGEMENT (Classes & Packs) ---
async function loadContent() {
  try {
    contentData = await window.callApi('adminGetWebsiteContent', token);
    renderContentLists();
  } catch (e) {
    toast(e.message);
  }
}

function renderContentLists() {
  const cls = $('classContentList'), pk = $('packContentList');
  cls.innerHTML = contentData.classes.length ? contentData.classes.map(c => contentItemHtml(c, 'class')).join('') : '<div class="empty">No featured classes yet.</div>';
  pk.innerHTML = contentData.packs.length ? contentData.packs.map(c => contentItemHtml(c, 'pack')).join('') : '<div class="empty">No video packs yet.</div>';
}

function contentItemHtml(item, type) {
  const thumb = item.imageUrl ? `<img src="${item.imageUrl}" class="content-thumb" alt="">` : `<div class="content-thumb">🖼</div>`;
  return `<div class="content-item">
    ${thumb}
    <div class="content-body">
      <b>${item.title}</b>
      <div class="desc">${item.description}</div>
      ${type === 'pack' ? `<div class="price">LKR ${Number(item.price).toLocaleString()}</div>` : ''}
    </div>
    <div class="actions">
      <button class="tiny del" onclick="deleteContent('${item.id}')">×</button>
    </div>
  </div>`;
}

window.deleteContent = async (id) => {
  if (!confirm('Delete this content?')) return;
  try {
    await window.callApi('adminDeleteWebsiteContent', token, id);
    toast('Content deleted.');
    await loadContent();
  } catch (e) { toast(e.message); }
};

// --- 5. GRADE CONTENT MANAGEMENT ---
async function loadGradeContent() {
  try {
    gradeContentData = await window.callApi('adminGetGradeContent', token);
    renderGradeContent();
  } catch (e) { toast(e.message); }
}

function renderGradeContent() {
  const grade = $('gradeContentGrade').value;
  const items = (gradeContentData[activeGradeType] || []).filter(x => String(x.grade) === String(grade));
  
  $('gradeContentListTitle').textContent = 'Grade ' + grade + ' · ' + activeGradeType;
  document.querySelectorAll('[data-grade-type]').forEach(b => {
    b.className = b.dataset.gradeType === activeGradeType ? 'primary' : 'secondary';
  });
  
  $('gradeContentList').innerHTML = items.length ? items.map(item => `
    <div class="content-item" style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)">
      <div><b>${item.title}</b><p style="font-size:12px;color:var(--muted)">${item.description}</p></div>
      <div class="actions"><button class="tiny del" onclick="deleteGradeContent('${item.id}')">×</button></div>
    </div>
  `).join('') : '<div class="empty">No content yet.</div>';
}

$('gradeContentGrade').addEventListener('change', renderGradeContent);
document.querySelectorAll('[data-grade-type]').forEach(b => b.addEventListener('click', () => {
  activeGradeType = b.dataset.gradeType;
  renderGradeContent();
}));

window.deleteGradeContent = async (id) => {
  if (!confirm('Delete this content?')) return;
  try {
    await window.callApi('adminDeleteGradeContent', token, id);
    toast('Content deleted.');
    await loadGradeContent();
  } catch (e) { toast(e.message); }
};

window.addEventListener('resize', () => {
  if (!$('dashboardView').classList.contains('hidden')) drawChart();
});
</script>
